name: CI

# CI:
# 1. gitleaks — проверка секретов в коде (A-40).
# 2. flutter build apk --flavor dev — сборка dev-окружения
#    (--dart-define=APP_ENV=dev, SUPABASE_ANON_KEY_DEV из secrets).
# 3. flutter build apk --flavor prod — сборка prod-окружения
#    (--dart-define=APP_ENV=prod, SUPABASE_ANON_KEY_PROD из secrets).
#
# ВАЖНО: флейвор и APP_ENV должны совпадать, иначе в APK попадут
# Firebase-опции другого окружения и старт упадёт с core/duplicate-app.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter-build:
    name: Flutter build (dev + prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Write google-services.json (dev)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_DEV not configured"
            exit 1
          fi
          mkdir -p android/app/src/dev
          echo "$GOOGLE_SERVICES_JSON" > android/app/src/dev/google-services.json

      - name: Write google-services.json (prod)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_PROD not configured"
            exit 1
          fi
          mkdir -p android/app/src/prod
          echo "$GOOGLE_SERVICES_JSON" > android/app/src/prod/google-services.json

      - name: Analyze
        run: flutter analyze

      - name: Build APK (dev)
        env:
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY_DEV" ]; then
            echo "::error::SUPABASE_ANON_KEY_DEV not configured"
            exit 1
          fi
          flutter build apk --flavor dev \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPABASE_ANON_KEY_DEV="$SUPABASE_ANON_KEY_DEV"

      - name: Build APK (prod)
        env:
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY_PROD" ]; then
            echo "::error::SUPABASE_ANON_KEY_PROD not configured"
            exit 1
          fi
          flutter build apk --flavor prod \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPABASE_ANON_KEY_PROD="$SUPABASE_ANON_KEY_PROD"